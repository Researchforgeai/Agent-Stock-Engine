[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-stock-engine"
version = "0.1.0"
description = "Indian equity research and NSE MCP integration"
requires-python = ">=3.11"
dependencies = [
    "langchain-azure-ai>=1.3,<2",
    "langchain-core>=1,<2",
    "mcp>=2.3,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
