[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-stock-engine"
version = "0.1.0"
description = "Autonomous Multi-Agent Equity Research & Recommendation System"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Research Forge AI" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "sqlmodel>=0.0.16",
    "yfinance>=0.2.38",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "pymupdf>=1.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
